# ============================================================
# claw-agent 生产环境配置
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  # MySQL 数据源（需提前创建数据库：CREATE DATABASE claw_agent DEFAULT CHARSET utf8mb4;）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cacheResultSetMetadata=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    # HikariCP 连接池调优（WebFlux 非阻塞 I/O，连接占用时间短，池不宜过大）
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:15}       # 最大连接数（默认 10 偏小，Agent 对话每条消息 3~5 次查询）
      minimum-idle: ${HIKARI_MIN_IDLE:5}              # 最小空闲连接（低于此值不回收，减少突发流量时的建连延迟）
      connection-timeout: 5000                        # 获取连接超时 5s（超时说明池已满或 MySQL 慢查询，不应久等）
      idle-timeout: 300000                            # 空闲连接存活 5min（高于 minimum-idle 的部分超时回收）
      max-lifetime: 900000                            # 连接最大存活 15min（避免 MySQL wait_timeout 导致死连接）
      leak-detection-threshold: 0                     # 生产环境关闭泄漏检测以提升性能
  # Redis 连接（AgentScope 分布式会话状态存储 + 通用缓存）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# ------------------------------------------------------------
# 应用自定义配置（生产环境）
# ------------------------------------------------------------
claw:
  # JWT 配置（生产环境必须用环境变量覆盖，不得依赖默认值）
  jwt:
    secret: ${CLAW_JWT_SECRET}   # ⚠️ 生产环境必填，无默认值
  # 上传文件存储目录（相对项目根目录）
  upload:
    dir: ${UPLOAD_DIR:/data/uploads}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:20}
  # Agent 基础配置（模型提供商/状态存储/权限模式等已数据库化）
  agent:
    name: claw-assistant        # Agent 名称
    workspace: ${AGENT_WORKSPACE:/opt/claw-agent/.agentscope/workspace}   # 工作区根路径（绝对路径，按 租户/用户 分子目录隔离）
  # 跨域（前后端分离）：允许的前端来源，生产环境收敛为具体域名；逗号分隔多个
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS}   # ⚠️ 生产环境必填，如 https://example.com,https://app.example.com

logging:
  level:
    com.claw.agent.mapper: INFO   # 生产环境关闭 SQL 日志以提升性能

# ------------------------------------------------------------
# OpenAPI 文档 + Swagger UI（生产环境禁用）
# ------------------------------------------------------------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
